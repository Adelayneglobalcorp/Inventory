name: Verify bilingual financing changes
on:
  push:
    branches:
      - feature/bilingual-financing-20261111
  pull_request:
    branches:
      - main
      - codex/migrate-production-source
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run validate
