name: Verify Global 360 visual redesign (no deployment)

on:
  push:
    branches:
      - design/global360-premium-login-20261112

jobs:
  build-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Run tests and production build (do not publish)
        run: npm run validate
